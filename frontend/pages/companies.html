<!DOCTYPE html>
<html>

<head>

<title>Companies</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<div class="container">

  <div class="nav" style="justify-content: space-between; align-items: center; width: 100%;">
    <h2 style="border: none; margin: 0; padding: 0;">Company Details</h2>
    <button onclick="goBack()" style="padding: 8px 16px; font-size: 0.9rem;">Back to Dashboard</button>
  </div>

  <div id="createCompanyCard" class="card">
    <h3 id="formTitle">Create Company</h3>
    <form id="companyForm">
        <input id="companyName" placeholder="Company Name" required>
        <input id="companyEmail" type="email" placeholder="Contact Email" required>
        <input id="companySector" placeholder="Sector (e.g. Technology, Finance)" required>
        <input id="companyLocation" placeholder="Location">
        <input id="companyWebsite" placeholder="Website" required>
        <input id="companyGstin" placeholder="GSTIN (15-character ID)" required pattern="^[0-9]{2}[A-Za-z]{5}[0-9]{4}[A-Za-z]{1}[0-9A-Za-z]{1}[zZ][0-9A-Za-z]{1}$" title="GSTIN must be a 15-character valid Indian GSTIN number (e.g., 27AAAAA0000A1Z5)">
        <textarea id="companyDescription" placeholder="Description"></textarea>
        <button type="submit">Save</button>
    </form>
  </div>

  <div class="card">
    <h3>Companies</h3>
    <div id="companyList">Loading companies...</div>
  </div>

</div>

<script src="../js/config.js"></script>
<script src="../js/company.js"></script>

</body>

</html>
