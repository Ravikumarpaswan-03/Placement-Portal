<!DOCTYPE html>
<html>

<head>
<title>Create Job</title>
<link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="container">

  <div class="nav" style="justify-content: space-between; align-items: center; width: 100%;">
    <h2 style="border: none; margin: 0; padding: 0;">Create New Job</h2>
    <button onclick="location.href='jobs.html'" style="padding: 8px 16px; font-size: 0.9rem;">Back to Jobs</button>
  </div>

  <div class="card">
    <h3 id="formTitle">Job Details</h3>
    <form id="jobForm">
        <input id="jobTitle" placeholder="Job Title" required>
        <input id="jobCompany" placeholder="Company Name" required>
        <input id="jobLocation" placeholder="Location">
        <input id="jobSkills" placeholder="Required Skills (comma separated)">
        <input id="jobSalary" placeholder="Package (e.g. 6 LPA)">
        <input id="jobDeadline" type="date">
        <input id="jobMinCgpa" type="number" step="0.1" min="0" max="10" placeholder="Minimum CGPA Eligibility (e.g. 7.5)">
        <textarea id="jobDescription" placeholder="Description"></textarea>
        <button id="submitJobBtn" type="submit">Create Job</button>
    </form>
  </div>

</div>

<script src="../js/config.js"></script>
<script src="../js/job.js"></script>

</body>

</html>
