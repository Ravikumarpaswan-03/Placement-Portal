<!DOCTYPE html>
<html>

<head>
<title>Company Dashboard</title>
<link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="container">

<h1>Company Dashboard</h1>

<div class="nav">
  <button onclick="navigateTo('companies.html')">Manage Company Profile</button>
  <button onclick="navigateTo('jobs.html')">Manage Jobs</button>
  <button onclick="navigateTo('applications.html')">View Applications</button>
  <button onclick="logout()">Logout</button>
</div>

<div class="card">
  <h2>Quick Overview</h2>
  <div class="stats-grid">
    <div class="stat-card">
      <h3>Total Students</h3>
      <p id="students">Loading...</p>
    </div>
    <div class="stat-card">
      <h3>Total Companies</h3>
      <p id="companies">Loading...</p>
    </div>
    <div class="stat-card">
      <h3>Total Jobs</h3>
      <p id="jobs">Loading...</p>
    </div>
    <div class="stat-card">
      <h3>Total Applications</h3>
      <p id="applications">Loading...</p>
    </div>
    <div class="stat-card">
      <h3>Shortlisted</h3>
      <p id="shortlisted">Loading...</p>
    </div>
    <div class="stat-card">
      <h3>Placed Students</h3>
      <p id="placed">Loading...</p>
    </div>
  </div>
</div>

</div>

<script src="../js/config.js"></script>
<script src="../js/company-dashboard.js"></script>

</body>

</html>
