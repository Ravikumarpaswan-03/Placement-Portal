<!DOCTYPE html>
<html>

<head>
<title>Students</title>
<link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="container">

  <div class="nav" style="justify-content: space-between; align-items: center; width: 100%;">
    <h2 id="pageHeader" style="border: none; margin: 0; padding: 0;">Student Profile</h2>
    <button onclick="goBack()" style="padding: 8px 16px; font-size: 0.9rem;">Back to Dashboard</button>
  </div>

  <!-- Profile Edit / Create Card -->
  <div id="profileFormSection" class="card">
    <h3 id="formTitle">Edit Profile</h3>
    <form id="studentForm">
        <input id="studentName" placeholder="Name" required>
        <input id="studentEmail" type="email" placeholder="Email" required>
        <input id="studentSkills" placeholder="Skills (comma separated)">
        <input id="studentCgpa" placeholder="CGPA" type="number" step="0.01" min="0" max="10">
        <input id="studentResume" placeholder="Resume Link (e.g. Google Drive/Dropbox URL)">
        <div style="display: flex; gap: 15px; flex-wrap: wrap; width: 100%;">
          <button type="submit" style="flex: 1;">Save Changes</button>
          <button id="deleteAccountBtn" type="button" onclick="deleteSelfAccount()" style="display: none; background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4); flex: 1;">Delete Account</button>
        </div>
    </form>
  </div>

  <!-- Students List Card (Admin Only) -->
  <div id="studentListSection" class="card" style="display: none;">
    <h3>All Students</h3>
    <div id="studentList">Loading students...</div>
  </div>

</div>

<script src="../js/config.js"></script>
<script src="../js/student.js"></script>

</body>

</html>
