<!DOCTYPE html>
<html>

<head>

<title>Student Dashboard</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<div class="container">

<h1>Student Dashboard</h1>

<div class="nav">
  <button onclick="navigateTo('student.html')">Edit Profile</button>
  <button onclick="navigateTo('jobs.html')">View Jobs</button>
  <button onclick="navigateTo('applications.html')">My Applications</button>
  <button onclick="logout()">Logout</button>
</div>

<div class="card">
  <h3>Profile</h3>
  <p id="userName">Welcome, Student!</p>
  <p id="userEmail"></p>
</div>

<div class="card">
  <h2>My Application Stats</h2>
  <div class="stats-grid">
    <div class="stat-card">
      <h3>Applied Jobs</h3>
      <p id="appliedCount">0</p>
    </div>
    <div class="stat-card">
      <h3>Shortlisted</h3>
      <p id="shortlistedCount">0</p>
    </div>
    <div class="stat-card">
      <h3>Selected</h3>
      <p id="selectedCount">0</p>
    </div>
  </div>
</div>

<!-- Account Settings Card -->
<div class="card">
  <h3>Account Settings</h3>
  <p style="margin-bottom: 15px; font-size: 0.9rem; color: #9ca3af;">Update your profile name, email, or change your login password credentials.</p>
  <form id="studentAccountSettingsForm">
    <input id="studentSelfName" placeholder="My Full Name" required>
    <input id="studentSelfEmail" type="email" placeholder="My Email Address" required>
    <div class="password-container">
      <input id="studentSelfPassword" type="password" placeholder="Confirm/Update My Password" required>
      <span class="password-toggle" onclick="togglePasswordVisibility('studentSelfPassword', this)">Show</span>
    </div>
    <button type="submit" style="background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);">Update My Account</button>
  </form>
</div>

</div>

<script src="../js/config.js"></script>
<script src="../js/student-dashboard.js"></script>

</body>

</html>
